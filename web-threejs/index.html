<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HydroCap 3D — Interactive Three.js Attachment & Hydration Viewer</title>
  <link rel="icon" href="data:," />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a252c;
    }
    #viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-card {
      position: fixed;
      z-index: 10;
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid #d5dde5;
      border-radius: 12px;
      box-shadow: 0 6px 22px rgba(20, 40, 60, 0.08);
      backdrop-filter: blur(8px);
    }
    #hud-left {
      top: 16px;
      left: 18px;
      padding: 12px 16px;
      max-width: 340px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #154360;
      letter-spacing: -0.2px;
    }
    .stage-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: #1b4f72;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    #stage-heading {
      font-size: 14px;
      font-weight: 700;
      color: #1b2631;
      margin: 4px 0 3px 0;
    }
    #stage-desc {
      font-size: 12px;
      line-height: 1.38;
      color: #4a5568;
    }
    #hud-right {
      top: 16px;
      right: 18px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 224px;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .metric-box {
      border-radius: 8px;
      padding: 6px 9px;
      text-align: center;
    }
    .metric-mass {
      background: #ebf5fb;
      border: 1px solid #85c1e9;
    }
    .metric-hc {
      background: #eafaf1;
      border: 1px solid #82e0aa;
    }
    .metric-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #2c3e50;
    }
    .metric-val {
      font-size: 17px;
      font-weight: 800;
      margin-top: 1px;
    }
    .metric-mass .metric-val { color: #154360; }
    .metric-hc .metric-val { color: #1e8449; }
    #power-pill {
      text-align: center;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 7px;
      background: #16a085;
    }
    .hw-foot {
      font-size: 10px;
      color: #566573;
      text-align: center;
      line-height: 1.25;
    }
    #controls-dock {
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      max-width: 96vw;
    }
    button {
      border: 1px solid #cbd5e0;
      background: #f8fafc;
      color: #1b2631;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
    }
    button:hover { background: #ebf5fb; border-color: #2980b9; }
    button.active { background: #1b4f72; color: #ffffff; border-color: #1b4f72; }
    label.ctrl-grp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: #2c3e50;
    }
    input[type="range"] { width: 105px; accent-color: #1b4f72; }
    body.headless #controls-dock { display: none !important; }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>

  <div id="hud-left" class="hud-card">
    <div class="brand-row">
      <span class="brand-title">💧 HydroCap 3D</span>
      <span id="stage-badge" class="stage-pill">Stage 1/5</span>
    </div>
    <div id="stage-heading">Universal Scroll-Chuck Clamp</div>
    <div id="stage-desc">3-jaw scroll ring locks onto 26–65 mm caps with Shore 40A pads.</div>
  </div>

  <div id="hud-right" class="hud-card">
    <div class="metrics-grid">
      <div class="metric-box metric-mass">
        <div class="metric-lbl">Bottle Mass</div>
        <div id="val-mass" class="metric-val">0 g</div>
      </div>
      <div class="metric-box metric-hc">
        <div class="metric-lbl">Health Connect</div>
        <div id="val-hc" class="metric-val">+0 mL</div>
      </div>
    </div>
    <div id="power-pill">POWER: SLEEP 6.4 uA</div>
    <div class="hw-foot">MDBT50Q (nRF52840) · NAU7802 · BMA400 · IPX8 USB-C</div>
  </div>

  <div id="controls-dock" class="hud-card">
    <button id="btn-play" class="active">Pause</button>
    <button class="btn-stage" data-t="1.1">1: Clamp</button>
    <button class="btn-stage" data-t="3.7">2: Weigh</button>
    <button class="btn-stage" data-t="6.2">3: Auto-Tare</button>
    <button class="btn-stage" data-t="8.7">4: BLE Sync</button>
    <button class="btn-stage" data-t="11.0">5: USB-C</button>
    <label class="ctrl-grp">Time <input id="scrub-time" type="range" min="0" max="12" step="0.05" value="0" /></label>
    <label class="ctrl-grp"><input id="chk-explode" type="checkbox" /> Exploded</label>
    <label class="ctrl-grp">Jaw <input id="scrub-jaw" type="range" min="28" max="65" step="1" value="32" /></label>
  </div>

  <script type="module" src="./scene.js"></script>
</body>
</html>
