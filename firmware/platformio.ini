; PlatformIO Project Configuration File — DrinkLog Smart Bottle Cap Tracker
; Supports 3 MCU targets + native desktop C++17 unit testing.

[platformio]
default_envs = xiao_nrf52840_bma400

[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; Select ONE load-sensing backend:
    -DSENSOR_NAU7802
    ; -DSENSOR_FX29_I2C

; ---------------------------------------------------------------------------
; 1. PRIMARY RECOMMENDED: Seeed XIAO nRF52840 + External BMA400 (~12 mo life)
; ---------------------------------------------------------------------------
[env:xiao_nrf52840_bma400]
platform = nordicnrf52
board = seeed_xiao_nrf52840
framework = arduino
monitor_speed = 115200
build_src_filter = +<main_nrf52.cpp>
build_flags =
    ${common.build_flags}
    -DMCU_XIAO_NRF52840
    -DIMU_BMA400
lib_deps =
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library @ ^1.0.6

; ---------------------------------------------------------------------------
; 2. ZERO-WIRING V1: Seeed XIAO nRF52840 Sense (Onboard LSM6DS3TR-C LP)
; ---------------------------------------------------------------------------
[env:xiao_nrf52840_sense]
platform = nordicnrf52
board = seeed_xiao_nrf52840_sense
framework = arduino
monitor_speed = 115200
build_src_filter = +<main_nrf52.cpp>
build_flags =
    ${common.build_flags}
    -DMCU_XIAO_NRF52840_SENSE
    -DIMU_LSM6DS3_SENSE
lib_deps =
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library @ ^1.0.6

; ---------------------------------------------------------------------------
; 3. BUDGET PROTOTYPE (~$6): Seeed XIAO ESP32-C6 + BMA400 (~5-6 mo life)
; ---------------------------------------------------------------------------
[env:xiao_esp32c6_bma400]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_src_filter = +<main_esp32c6.cpp>
build_flags =
    ${common.build_flags}
    -DMCU_XIAO_ESP32C6
    -DIMU_BMA400
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library @ ^1.0.6

; ---------------------------------------------------------------------------
; 4. NATIVE UNIT TESTS (g++ C++17 core DSP & ring-buffer verification)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_build_src = no
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
